services:

  calculator:
    build:
      context: .
      dockerfile: Dockerfile
    image: calculator-devops:1.0
    container_name: calculator-app
    expose:
      - "8081"
    restart: unless-stopped
    networks:
      - calculator-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: calculator-nginx
    ports:
      - "8082:80"
    depends_on:
      calculator:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - calculator-network
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  calculator-network:
    driver: bridge